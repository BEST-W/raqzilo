<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>واجهة — إدارة المتجر</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{color-scheme:dark}body{background:#0b090f;color:#f5eefb;font:15px/1.8 Tahoma,Arial;margin:0}main{max-width:800px;margin:auto;padding:24px}section,article{background:#18121f;border:1px solid #493653;border-radius:16px;padding:18px;margin:16px 0}label{display:grid;gap:6px;margin:12px 0}input,textarea,select,button{font:inherit;color:inherit;background:#251b30;border:1px solid #694986;border-radius:8px;padding:10px;max-width:100%;box-sizing:border-box}textarea{min-height:90px}button{cursor:pointer;background:#7045a4}small,p{color:#bcadc9}.row{display:flex;gap:12px;flex-wrap:wrap}[hidden]{display:none!important}#status{white-space:pre-wrap}h1{font-size:25px}</style>
<main><h1>واجهة — لوحة المالك</h1><p>افتح هذه الصفحة داخل تلجرام بالحساب المالك. الأسعار هنا مسودات؛ الدفع معطّل.</p><button id="load">فتح / تحديث اللوحة</button><p id="status" role="status"></p><div id="workspace" hidden><section><h2>المنتجات</h2><select id="product"></select><form id="product-form"><label>المعرّف<input name="id" required pattern="[a-z0-9-]{1,64}"></label><label>الاسم<input name="title" required maxlength="2000"></label><label>الاسم الإنجليزي<input name="subtitle"></label><label>الوصف<textarea name="description"></textarea></label><label>التصنيف<select name="category"><option value="services">خدمات</option><option value="web">قوالب مواقع</option><option value="files">ملفات</option></select></label><label>الغلاف الافتراضي<select name="cover"><option>folio</option><option>bot</option><option>cv</option><option>shop</option><option>landing</option></select></label><label>رابط الصورة HTTPS<input name="image_url" type="url" placeholder="https://…"></label><label>تفاصيل البطاقة<input name="meta"></label><label>السعر بالنجوم — مسودة غير قابلة للدفع<input name="price_stars" type="number" min="1" max="1000000"></label><label>وصف السعر<input name="price_label" placeholder="السعر لم يحدد"></label><label>التسليم<input name="delivery"></label><label>الخصائص — سطر لكل خاصية<textarea name="features"></textarea></label><label>الخانات / الخيارات — سطر لكل خيار<textarea name="options"></textarea></label><label><span><input type="checkbox" name="visible"> ظاهر في المتجر</span></label><div class="row"><button>حفظ المنتج</button><button type="button" id="add">إضافة منتج غير مفعّل للبيع</button></div></form></section><section><h2>المظهر والتواصل</h2><form id="settings-form"><label>لون التمييز<input name="accent" type="color"></label><label>الخلفية<input name="background" type="color"></label><label>اسم حساب الدعم دون @<input name="support_username" pattern="[A-Za-z0-9_]{0,32}"></label><label>اسم القناة دون @<input name="channel_username" pattern="[A-Za-z0-9_]{0,32}"></label><label>الجوال<input name="phone" maxlength="120"></label><label>البريد<input name="email" maxlength="120"></label><p>خانات طلب الخدمة الأساسية: الاسم، الوظيفة، والمتطلبات. تبقى مطلوبة لضمان إمكانية مراجعة الطلب.</p><button>حفظ الإعدادات</button></form></section><section><h2>الطلبات</h2><div id="orders"></div></section></div></main>
<script>
const $=id=>document.getElementById(id),tg=window.Telegram?.WebApp;tg?.ready();let state,selected;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body={}){if(!tg?.initData)throw Error('افتح اللوحة داخل تلجرام.');const r=await fetch('/api/admin/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,init_data:tg.initData}),signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error(r.status===403?'هذا الحساب ليس مالك المتجر.':r.status===400?'تحقق من الحقول أو أعد فتح المتجر لتجديد هوية تلجرام.':'تعذر الاتصال بالخادم.');return r.json()}
function product(){selected=state.products.find(p=>p.id===$('product').value);for(const e of $('product-form').elements){if(!e.name)continue;const v=selected[e.name];if(e.type==='checkbox')e.checked=v!==false;else e.value=Array.isArray(v)?v.join('\n'):v??''}$('product-form').elements.id.readOnly=true}
function render(){ $('workspace').hidden=false;$('product').innerHTML=state.products.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.title)+'</option>').join('');product();for(const e of $('settings-form').elements)if(e.name)e.value=state.settings[e.name]??'';$('orders').innerHTML=state.orders.length?state.orders.map(o=>'<article><strong>'+esc(o.id)+'</strong><p>حساب تلجرام: '+esc(o.user_id)+' · '+esc(new Date(o.created_at*1000).toLocaleString('ar-SA'))+'</p>'+(o.brief?'<h3>'+esc(o.brief.name)+'</h3><p>'+esc(o.brief.kind)+'</p><p style="white-space:pre-wrap">'+esc(o.brief.idea)+'</p><label>حالة الطلب<select data-order="'+esc(o.id)+'">'+['submitted','reviewing','awaiting_customer','completed','cancelled'].map((s,i)=>'<option value="'+s+'"'+(o.status===s?' selected':'')+'>'+['مستلم','قيد المراجعة','بانتظار العميل','مكتمل','ملغي'][i]+'</option>').join('')+'</select></label>':'<p>تجربة تسليم مجانية</p>')+'</article>').join(''):'لا توجد طلبات.'}
async function load(){try{state=await api('state');render();$('status').textContent='تم تحميل البيانات الخاصة بالمالك.'}catch(e){$('workspace').hidden=true;$('status').textContent=e.message}}
$('load').onclick=load;$('product').onchange=product;
$('add').onclick=()=>{selected={id:'',title:'',category:'files',cover:'folio',visible:false,demo:false,service:false};for(const e of $('product-form').elements){if(!e.name)continue;if(e.type==='checkbox')e.checked=false;else e.value=selected[e.name]??''}$('product-form').elements.id.readOnly=false;};
$('product-form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const f=e.target,p={...selected};for(const el of f.elements){if(!el.name)continue;p[el.name]=el.type==='checkbox'?el.checked:['features','options'].includes(el.name)?el.value.split('\n').map(s=>s.trim()).filter(Boolean):el.name==='price_stars'?(el.value?Number(el.value):null):el.value.trim()}const products=state.products.map(x=>x.id===selected.id?p:x);if(!selected.id)products.push(p);await api('products',{products});await load();$('status').textContent='حُفظ المنتج. البيع ما زال معطّلًا.'}catch(e){$('status').textContent=e.message}finally{b.disabled=false}};
$('settings-form').onsubmit=async e=>{e.preventDefault();try{const settings={...state.settings};for(const el of e.target.elements)if(el.name)settings[el.name]=el.value.trim();await api('settings',{settings});await load();$('status').textContent='حُفظت الإعدادات.'}catch(e){$('status').textContent=e.message}};
$('orders').onchange=async e=>{const id=e.target.dataset.order;if(!id)return;try{await api('order',{id,status:e.target.value});$('status').textContent='حُفظت حالة الطلب.'}catch(e){$('status').textContent=e.message;await load()}};
load();
</script></html>
