services:
  - type: web
    name: wajha-store
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: python -m compileall bot.py server.py storage.py
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: AUTO_CONFIGURE_WEBHOOK
        value: "false"
      - key: CHANNEL_USERNAME
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: OWNER_TELEGRAM_ID
        value: "5491407621"
      - key: DATA_DIR
        value: /tmp/wajha-data
      - key: ACCEPT_SERVICE_REQUESTS
        value: "false"
